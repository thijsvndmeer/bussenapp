name: Deploy to Google Play

on:
  push:
    branches:
      - beta
      - prod
  workflow_dispatch:
    inputs:
      track:
        description: 'Track to deploy to'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production
          - internal

permissions:
  contents: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. VALIDATE & RELEASE GATES
  # -------------------------------------------------------------
  validate:
    name: Validate & Release Gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      version_code: ${{ steps.pkg.outputs.version_code }}
      track: ${{ steps.determine_track.outputs.track }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Google Play Track
        id: determine_track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            echo "track=production" >> $GITHUB_OUTPUT
          else
            echo "track=beta" >> $GITHUB_OUTPUT
          fi

      - name: Validate Patch Notes Gates (Prod only)
        if: ${{ steps.determine_track.outputs.track == 'production' }}
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          echo "Latest release tag: $LATEST_TAG"

          if [ -n "$LATEST_TAG" ]; then
            # 1. Patch notes gate: ensure whatsnew files have changed
            WHATSNEW_DIFF=$(git diff "$LATEST_TAG" HEAD -- distribution/whatsnew/)
            if [ -z "$WHATSNEW_DIFF" ]; then
              echo "::error::[Release Gate Failed] distribution/whatsnew/ has not changed since previous release ($LATEST_TAG). Update whatsnew notes before deploying to prod."
              exit 1
            fi
          fi

          # 2. Ensure files are non-empty
          if [ ! -s "distribution/whatsnew/whatsnew-nl-NL" ] || [ ! -s "distribution/whatsnew/whatsnew-en-US" ]; then
            echo "::error::[Release Gate Failed] distribution/whatsnew/ files must not be empty."
            exit 1
          fi

          echo "Release gates passed: What's New notes are updated."

      - name: Resolve Version & Auto-Bump Version Code
        id: pkg
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
        run: |
          git fetch --tags --force
          node scripts/resolve-version-code.cjs

  # -------------------------------------------------------------
  # 2. TYPECHECK & LINT
  # -------------------------------------------------------------
  typecheck:
    name: TypeScript Typecheck
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

  # -------------------------------------------------------------
  # 3. BUILD WEB ASSETS
  # -------------------------------------------------------------
  build-web:
    name: Build Web Assets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
          VITE_ADMOB_INTERSTITIAL_QUIT_UNIT_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_QUIT_UNIT_ID }}
          VITE_ADMOB_INTERSTITIAL_LEADERBOARD_UNIT_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_LEADERBOARD_UNIT_ID }}
          VITE_ADMOB_REWARDED_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_UNIT_ID }}
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # -------------------------------------------------------------
  # 4. BUILD & SIGN ANDROID (AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build & Sign Android (AAB)
    needs: [validate, typecheck, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Lint (Baseline enforced)
        working-directory: ./android
        env:
          ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
        run: ./gradlew lintRelease --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      - name: Build Android App Bundle (AAB)
        working-directory: ./android
        env:
          ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          VERSION_NAME: ${{ needs.validate.outputs.version }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Sign AAB
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS || 'bussen-release' }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ needs.validate.outputs.track }}-v${{ needs.validate.outputs.version }}-code${{ needs.validate.outputs.version_code }}.aab
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          retention-days: 14

      - name: Share Signed File for Deploy Job
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-bundle
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          retention-days: 1

  # -------------------------------------------------------------
  # 5. DEPLOY TO GOOGLE PLAY
  # -------------------------------------------------------------
  deploy-playstore:
    name: Deploy to Google Play
    needs: [validate, build-android]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate.outputs.track == 'production' && 'google-play-prod' || 'google-play-beta' }}
      url: https://play.google.com/store/apps/details?id=com.bussen.app
    steps:
      - name: Checkout repository (for patch notes)
        uses: actions/checkout@v4

      - name: Download Signed AAB Bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-aab-bundle
          path: signed-bundle

      - name: Deploy to Google Play Track
        env:
          PLAY_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.bussen.app
          releaseFiles: signed-bundle/app-release.aab
          track: ${{ needs.validate.outputs.track }}
          whatsNewDirectory: distribution/whatsnew
          status: completed

  # -------------------------------------------------------------
  # 6. GITHUB RELEASE (Production only)
  # -------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [validate, build-android, deploy-playstore]
    if: ${{ needs.validate.outputs.track == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Signed AAB Bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-aab-bundle
          path: signed-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          body_path: distribution/whatsnew/whatsnew-nl-NL
          generate_release_notes: true
          files: signed-bundle/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # 7. NOTIFICATION & SUMMARY
  # -------------------------------------------------------------
  summary:
    name: Deployment Summary
    needs: [validate, build-android, deploy-playstore]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Summary to Step Summary
        run: |
          echo "## 🚀 Google Play Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Track** | \`${{ needs.validate.outputs.track }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v${{ needs.validate.outputs.version }}\` (code: \`${{ needs.validate.outputs.version_code }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | **${{ job.status }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Google Play Store listing: [Bussen on Google Play](https://play.google.com/store/apps/details?id=com.bussen.app)" >> $GITHUB_STEP_SUMMARY
