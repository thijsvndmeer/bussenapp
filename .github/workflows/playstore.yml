name: Deploy to Google Play

on:
  push:
    branches:
      - beta
      - prod
  workflow_dispatch:
    inputs:
      track:
        description: 'Track to deploy to'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production
          - internal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build Web App
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Lint (Baseline enforced)
        working-directory: ./android
        env:
          ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
        run: ./gradlew lintRelease --stacktrace

      - name: Upload Lint Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Build Android App Bundle (AAB)
        working-directory: ./android
        env:
          ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Sign AAB
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Determine Google Play Track
        id: determine_track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            echo "track=production" >> $GITHUB_OUTPUT
          else
            echo "track=beta" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.bussen.app
          releaseFiles: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          track: ${{ steps.determine_track.outputs.track }}
          status: completed

      - name: Upload AAB Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.determine_track.outputs.track }}-${{ github.run_number }}.aab
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          retention-days: 14
